[project]
name = "nexus-ai-pc-dashboard"
version = "0.9.0.dev1"
description = "Local-first dashboard backend for the Nexus AI-PC project"
requires-python = ">=3.12"
dependencies = [
  "ddgs>=9.14,<10",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "fsrs>=6,<7",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "litellm>=1.70,<2",
  "mcp>=1,<2",
  "onnxruntime>=1.23,<2",
  "paper-qa>=5,<6",
  "paper-qa-pypdf==5.29.1",
  "playwright>=1.50,<2",
  "pymupdf>=1.24,<2",
  "qdrant-client>=1.14,<2",
  "rapidocr>=3.9,<4",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
lab = [
  "jupyterlab>=4,<5",
  "langgraph>=0.6,<1",
  "pandas>=2.2,<3",
  "polars>=1,<2",
  "scipy>=1.14,<2",
  "sqlmodel>=0.0.24,<1",
  "statsmodels>=0.14,<1",
  "sympy>=1.13,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = [
  "backend/bridge.py",
  "backend/cli.py",
  "backend/improvements.py",
  "backend/research.py",
  "backend/system_routes.py",
  "backend/version.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
