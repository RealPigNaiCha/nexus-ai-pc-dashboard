[project]
name = "nexus-ai-pc-dashboard"
version = "0.1.0"
description = "Local-first dashboard backend for the Nexus AI-PC project"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<1",
  "fsrs>=6,<7",
  "httpx>=0.28,<1",
  "jupyterlab>=4,<5",
  "keyring>=25,<26",
  "langgraph>=0.6,<1",
  "litellm>=1.70,<2",
  "mcp>=1,<2",
  "pandas>=2.2,<3",
  "polars>=1,<2",
  "pydantic-settings>=2,<3",
  "pymupdf>=1.24,<2",
  "qdrant-client>=1.14,<2",
  "scipy>=1.14,<2",
  "sqlmodel>=0.0.24,<1",
  "sse-starlette>=2,<4",
  "statsmodels>=0.14,<1",
  "sympy>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
  "watchdog>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
