name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: uv sync --dev --locked
      - name: Lint Python
        run: uv run ruff check backend tests
      - name: Check Python types
        run: uv run pyright
      - name: Test backend
        run: uv run pytest --cov=backend --cov-report=term-missing --cov-fail-under=80
      - name: Check frontend syntax
        run: node --check app.js
